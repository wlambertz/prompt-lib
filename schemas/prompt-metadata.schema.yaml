schema_name: prompt-metadata
schema_version: 1.0
description: >
  Leitfaden fuer die erwartete Struktur von Prompt-Metadaten. Das Schema ist
  bewusst leichtgewichtig und JSON-Schema-inspiriert, damit es von Menschen
  gelesen und von einfachen Tools validiert werden kann.

type: object
required:
  - id
  - name
  - category
  - owner
  - status
  - version
  - tags
  - use_cases
  - input_format
  - output_format
  - language
  - model_compatibility
  - risk_notes
  - created_at
  - updated_at

properties:
  id:
    type: string
    description: Stabile technische Kennung, eindeutig innerhalb des Repositories.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    example: coding-refactor-plan
  name:
    type: string
    description: Lesbarer Name des Prompts.
  category:
    type: string
    enum:
      - analysis
      - coding
      - communication
      - documentation
      - ideation
      - summarization
  owner:
    type: string
    description: Verantwortliches Team oder verantwortliche Person.
  status:
    type: string
    enum:
      - draft
      - review
      - active
      - deprecated
      - archived
  version:
    type: string
    description: Semantische Versionsnummer des Prompt-Inhalts.
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  tags:
    type: array
    minItems: 1
    items:
      type: string
  use_cases:
    type: array
    minItems: 1
    items:
      type: string
  input_format:
    type: string
    description: Erwartetes Eingabeformat, zum Beispiel markdown, text, json oder code.
  output_format:
    type: string
    description: Erwartetes Ausgabeformat, zum Beispiel markdown, json, bullet-list.
  language:
    type: string
    description: Primaere Sprache des Prompt-Textes.
    examples:
      - de
      - en
      - multilingual
  model_compatibility:
    type: array
    minItems: 1
    items:
      type: string
    description: Modelle oder Modellfamilien, mit denen der Prompt sinnvoll getestet wurde.
  risk_notes:
    type: array
    minItems: 1
    items:
      type: string
    description: Bekannte Risiken, Grenzen oder Fehlanwendungen.
  created_at:
    type: string
    format_hint: YYYY-MM-DD
  updated_at:
    type: string
    format_hint: YYYY-MM-DD

validation_notes:
  - Jeder Prompt soll genau einer Hauptkategorie zugeordnet sein.
  - `id` und Dateiname sollen fachlich zusammenpassen, muessen aber nicht identisch sein.
  - `updated_at` muss bei jeder inhaltlichen Aenderung aktualisiert werden.
  - `status: active` darf nur verwendet werden, wenn der Prompt mindestens einmal reviewed wurde.
